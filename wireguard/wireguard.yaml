- name: 'configure wireguard'
  hosts: all
  become: true
  gather_facts: true
  vars:
    server: 'minori'
    clients:
      - 't450s'
      - 'rin'
      - 'sachiko'
      - 'kotone'
      - 'nonoka'
      - 'dad'
      - 'komachi'
      - 'pixel6a'
      - 'kosuzu'
      - 'sachiko-win'

  tasks:
    - name: 'install packages'
      ansible.builtin.apt:
        name:
          - 'wireguard'
          - 'unbound'

    - name: 'enable IPv4 forwarding'
      ansible.posix.sysctl:
        name: 'net.ipv4.ip_forward'
        value: '1'

    - name: 'enable IPv6 forwarding'
      ansible.posix.sysctl:
        name: 'net.ipv6.conf.all.forwarding'
        value: '1'

    - name: 'use bbr congestion control'
      ansible.posix.sysctl:
        name: 'net.ipv4.tcp_congestion_control'
        value: 'bbr'

    - name: 'use fq qdisc'
      ansible.posix.sysctl:
        name: 'net.core.default_qdisc'
        value: 'fq'

    - name: 'create wg0 config'
      notify: 'restart wireguard service'
      ansible.builtin.template:
        src: 'wg0.conf.j2'
        dest: '/etc/wireguard/wg0.conf'
        mode: '0600'

    - name: 'enable wireguard service'
      ansible.builtin.systemd:
        name: 'wg-quick@wg0'
        state: started
        enabled: true

    - name: 'create base unbound config'
      notify: 'restart unbound service'
      ansible.builtin.copy:
        src: 'unbound.conf'
        dest: '/etc/unbound/unbound.conf.d/server.conf'

    - name: 'create wireguard unbound config'
      notify: 'restart unbound service'
      ansible.builtin.template:
        src: 'unbound-wireguard.conf.j2'
        dest: '/etc/unbound/unbound.conf.d/wireguard.conf'

    - name: 'enable unbound service'
      ansible.builtin.systemd:
        name: 'unbound'
        state: started
        enabled: true

  handlers:
    - name: 'restart wireguard service'
      ansible.builtin.systemd:
        name: 'wg-quick@wg0'
        state: restarted

    - name: 'restart unbound service'
      ansible.builtin.systemd:
        name: 'unbound'
        state: restarted
