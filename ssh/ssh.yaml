- name: 'configure ssh'
  hosts: all
  vars:
    authorized_key_names:
      - andrew@sachiko
      - andrew@t450s
      - shellfish@koharu
      - shellfish@komachi

  tasks:
    - name: 'configure authorized keys'
      with_items: '{{ authorized_key_names }}'
      ansible.posix.authorized_key:
        user: '{{ ansible_user }}'
        key: '{{ lookup("ansible.builtin.pipe", "pass ssh/" + item | quote + ".pub") }}'
